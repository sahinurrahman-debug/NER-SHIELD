
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /app/models/risk_model.joblib
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      SMS_PROVIDER: ${SMS_PROVIDER:-fast2sms}
      FAST2SMS_API_KEY: ${FAST2SMS_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      ALERT_SMS_RECIPIENTS: ${ALERT_SMS_RECIPIENTS:-}
      ALERT_SEVERITY_THRESHOLD: ${ALERT_SEVERITY_THRESHOLD:-high}
      ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-15}
      ALERT_LANGUAGES: ${ALERT_LANGUAGES:-en,hi,as,bn}
      API_KEY: ${API_KEY:-}
      MONITOR_ENABLED: ${MONITOR_ENABLED:-true}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-120}
      WEATHER_PROVIDER: ${WEATHER_PROVIDER:-open_meteo}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models:ro
      - ./backend/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: